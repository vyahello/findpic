# findpic bot, deployed alongside an existing local Telegram Bot API server.
#
# Two containers by design:
#
#   bot      — unprivileged, read-only, parses files that arrive from strangers
#   janitor  — root, does nothing but delete this bot's processed uploads
#
# The split exists because the shared Bot API volume grants uid 1000 read access
# but not write. Running the bot itself as root to gain a delete would put root
# on the process that parses hostile input, which is exactly the wrong trade.

name: findpic

services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # Must equal the UID of the host account the Bot API volume's ACL grants
        # read access to — `id -u cax` on this box. See APP_UID in .env.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: findpic-bot:latest
    container_name: findpic-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Talk to the local Bot API server rather than api.telegram.org: it lifts
      # the 20 MB download ceiling to 2 GB and hands back a filesystem path
      # instead of a URL, so originals are read with no download step.
      BOT_API_BASE: http://remy-bot-api:8081
      BOT_API_IS_LOCAL: "1"
      BOT_API_FILES_ROOT: /var/lib/telegram-bot-api
      DATABASE_PATH: /data/findpic-bot.sqlite3
      WORK_DIR: /tmp/findpic
      # Without this the geocode cache resolves to ~/.cache, which is inside the
      # read-only image: every save failed silently and every GPS photo paid a
      # live Nominatim round trip, one per second, holding a worker thread.
      XDG_CACHE_HOME: /data/cache
      # Keeping a copy of every picture. Commented out is the default: an
      # archive is a decision about other people's photographs, not a setting.
      # ARCHIVE_HOST_DIR in deploy/.env chooses where they land on the host.
      ARCHIVE_DIR: ${ARCHIVE_DIR:-}
      # The same directory as the host sees it. The bot never opens this —
      # it only writes it down, so a report reading the database from the
      # host or from a laptop knows where the files actually are.
      ARCHIVE_HOST_DIR: ${ARCHIVE_HOST_DIR:-}
      ARCHIVE_MAX_FILE_MB: "32"
      ARCHIVE_MAX_TOTAL_MB: "4096"
      ARCHIVE_MAX_USER_MB: "512"
      ARCHIVE_MIN_FREE_MB: "2048"
      ARCHIVE_RETENTION_DAYS: "30"
      # The janitor owns deletion; this process has no write access there.
      DELETE_SOURCE_FILES: "0"
    volumes:
      - findpic-data:/data
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api:ro
      # A bind mount rather than a named volume, and that is the whole point: a
      # named volume lives under /var/lib/docker as root:root 0700, so looking
      # at a single JPEG would need sudo or a throwaway container. This is
      # ls-able and scp-able with neither. It stays writable despite
      # `read_only: true`, which governs the image layers and not the mounts.
      #
      # Must be an absolute path OUTSIDE the checkout: the deploy workflow runs
      # `git clean -qfd`, which would delete an archive sitting under the repo.
      #
      # Mounted unconditionally, with ARCHIVE_DIR as the switch. A conditional
      # mount would mean the compose file changes shape depending on a variable,
      # and the failure when it is wrong is a container that will not start.
      # An empty directory nobody writes to costs nothing.
      - ${ARCHIVE_HOST_DIR:-/tmp/findpic-archive}:/archive
    networks:
      - remy
    tmpfs:
      # Analysis scratch lives in RAM and never survives a restart.
      - /tmp:size=512m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import findpic.bot.runner"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  janitor:
    image: alpine:3.20
    container_name: findpic-janitor
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/lib/telegram-bot-api:/files
    # Scoped to this bot's own token directory and nothing else — the volume is
    # shared with other bots whose files are none of our business.
    command:
      - sh
      - -c
      - |
        set -eu
        test -n "$${BOT_TOKEN}" || { echo "BOT_TOKEN is required"; exit 1; }
        target="/files/$${BOT_TOKEN}"
        echo "janitor watching $${target}"
        while true; do
          if [ -d "$${target}" ]; then
            find "$${target}" -type f -mmin +5 -delete 2>/dev/null || true
            find "$${target}" -type d -empty -mindepth 1 -delete 2>/dev/null || true
          fi
          sleep 60
        done
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }

volumes:
  findpic-data:

networks:
  remy:
    # Created by the remy compose project; findpic joins it to reach the Bot API
    # server by name rather than exposing another port on the host.
    name: remy_default
    external: true
