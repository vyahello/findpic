<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="findpic bot icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#15263f"/>
      <stop offset="100%" stop-color="#1e2f4d"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Telegram crops avatars to a circle, so nothing meaningful goes in the corners. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="200" fill="url(#glow)"/>

  <g transform="translate(256 248)">
    <!-- Aperture ring -->
    <circle r="150" fill="none" stroke="url(#blade)" stroke-width="18"/>

    <!-- Six blades. Heavy strokes so the shape survives a 40px avatar. -->
    <g stroke="url(#blade)" stroke-width="15" stroke-linecap="round" opacity="0.95">
      <path d="M0 -150 L75 -20"/>
      <path d="M130 -75 L55 55"/>
      <path d="M130 75 L-20 75"/>
      <path d="M0 150 L-75 20"/>
      <path d="M-130 75 L-55 -55"/>
      <path d="M-130 -75 L20 -75"/>
    </g>

    <!-- Scan line and core: metadata being read out of the lens. -->
    <path d="M-150 0 L150 0" stroke="#f8fafc" stroke-width="9" opacity="0.5"/>
    <circle r="26" fill="#f8fafc" opacity="0.95"/>
    <circle r="26" fill="none" stroke="#0f172a" stroke-width="5" opacity="0.35"/>
  </g>
</svg>
